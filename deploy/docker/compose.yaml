services:
  tailscale:
    image: tailscale/tailscale:v1.88.4
    hostname: ${ISNADI_HOSTNAME:-isnadi}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    restart: unless-stopped

  isnadi:
    image: ${ISNADI_IMAGE:-isnadi-remote:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    network_mode: service:tailscale
    environment:
      T3CODE_MODE: web
      T3CODE_HOST: 0.0.0.0
      T3CODE_PORT: 3773
      T3CODE_NO_BROWSER: "true"
      ISNADI_HOME: /data
    volumes:
      - isnadi-data:/data
      - ${ISNADI_WORKSPACE:-$HOME}:/workspace
    restart: unless-stopped
    depends_on: [tailscale]

volumes:
  isnadi-data:
    name: ${ISNADI_DATA_VOLUME:-isnadi-data}
  tailscale-state:
    name: ${ISNADI_TAILSCALE_VOLUME:-isnadi-tailscale-state}
