services:
  isnadi:
    image: ${ISNADI_IMAGE:-isnadi-remote:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:3773:3773"
    environment:
      T3CODE_MODE: web
      T3CODE_HOST: 0.0.0.0
      T3CODE_PORT: 3773
      T3CODE_NO_BROWSER: "true"
      ISNADI_HOME: /data
    volumes:
      - isnadi-data:/data
      - ${ISNADI_WORKSPACE:-$HOME}:/workspace
    restart: unless-stopped
volumes:
  isnadi-data:
    name: ${ISNADI_DATA_VOLUME:-isnadi-data}
